unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g default-terminal "tmux-256color"
set -g base-index 1

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Track loaded sessions and preserve unloaded sessions when tmux-resurrect saves
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes ':all:'
set -g @resurrect-strategy-nvim 'session'
set-hook -g session-created 'run-shell "$HOME/.config/hypr/tmux-lazy-helper.sh mark-loaded \"#{session_name}\""'
set-hook -g client-detached 'run-shell -b "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet >/dev/null 2>&1"'
set -g @resurrect-hook-post-save-layout "$HOME/.config/hypr/tmux-lazy-helper.sh post-save-hook"
bind-key C-u run-shell "$HOME/.config/hypr/tmux-lazy-helper.sh unload-session \"#{session_name}\""

# Configure the catppuccin plugin
set-window-option -g status-position top
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "#242638" 
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_text " #W "
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}#($HOME/.config/hypr/tmux-lazy-helper.sh auto-save)"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
