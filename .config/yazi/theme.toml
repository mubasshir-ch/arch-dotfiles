# Yazi Catppuccin Mocha Theme

[mgr]
cwd = { fg = "#cba6f7", bold = true }

# Hovered / Cursor
hovered = { bg = "#313244", fg = "#cdd6f4", bold = true }
preview_hovered = { underline = true }

# Find / Filter
find_keyword = { fg = "#f9e2af", bold = true, italic = true }
find_position = { fg = "#fab387", bold = true }

# Marker
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#89dceb", bg = "#89dceb" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

# Tab
tab_active = { fg = "#181825", bg = "#cba6f7", bold = true }
tab_inactive = { fg = "#cdd6f4", bg = "#313244" }
tab_width = 1

# Count
count_copied = { fg = "#181825", bg = "#a6e3a1" }
count_cut = { fg = "#181825", bg = "#f38ba8" }
count_selected = { fg = "#181825", bg = "#89b4fa" }

# Border
border_symbol = "│"
border_style = { fg = "#585b70" }

[mode]
normal_main = { fg = "#181825", bg = "#89b4fa", bold = true }
normal_alt = { fg = "#89b4fa", bg = "#313244" }

select_main = { fg = "#181825", bg = "#a6e3a1", bold = true }
select_alt = { fg = "#a6e3a1", bg = "#313244" }

unset_main = { fg = "#181825", bg = "#f38ba8", bold = true }
unset_alt = { fg = "#f38ba8", bg = "#313244" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#313244", bg = "#313244" }

# Mode indicator
mode_normal = { fg = "#181825", bg = "#89b4fa", bold = true }
mode_select = { fg = "#181825", bg = "#a6e3a1", bold = true }
mode_unset = { fg = "#181825", bg = "#f38ba8", bold = true }

# Progress
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error = { fg = "#f38ba8", bg = "#313244" }

# Permissions
permissions_t = { fg = "#89b4fa" }
permissions_r = { fg = "#f9e2af" }
permissions_w = { fg = "#f38ba8" }
permissions_x = { fg = "#a6e3a1" }
permissions_s = { fg = "#6c7086" }

[input]
border = { fg = "#cba6f7" }
title = { fg = "#cdd6f4" }
value = { fg = "#cdd6f4" }
selected = { bg = "#45475a" }

[select]
border = { fg = "#cba6f7" }
active = { fg = "#f9e2af", bold = true }
inactive = { fg = "#cdd6f4" }

[tasks]
border = { fg = "#585b70" }
title = { fg = "#cdd6f4" }
hovered = { underline = true }

[which]
mask = { bg = "#1e1e2e" }
cand = { fg = "#89dceb" }
rest = { fg = "#9399b2" }
desc = { fg = "#cdd6f4" }
separator = " ➜ "
separator_style = { fg = "#585b70" }

[help]
on = { fg = "#89dceb" }
exec = { fg = "#a6e3a1" }
desc = { fg = "#cdd6f4" }
hovered = { bg = "#313244", bold = true }
footer = { fg = "#313244", bg = "#cdd6f4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#fab387" },

	# Videos
	{ mime = "video/*", fg = "#f9e2af" },
	{ mime = "audio/*", fg = "#f9e2af" },

	# Archives
	{ mime = "application/*zip", fg = "#eba0ac" },
	{ mime = "application/x-tar", fg = "#eba0ac" },
	{ mime = "application/x-bzip2", fg = "#eba0ac" },
	{ mime = "application/x-7z-compressed", fg = "#eba0ac" },
	{ mime = "application/x-rar", fg = "#eba0ac" },

	# Documents
	{ mime = "application/pdf", fg = "#f38ba8" },

	# Fallback
	{ name = "*", fg = "#cdd6f4" },
	{ name = "*/", fg = "#89b4fa" },
]
