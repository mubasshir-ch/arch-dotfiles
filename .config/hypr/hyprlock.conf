background {
    monitor =
    path = screenshot
    color = rgba(31, 29, 46, 0.5) 
    
    # Drastically reduced to match swaylock's lighter feel
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    # 400x400 with maximum rounding creates a perfect circle (indicator-radius=200)
    size = 400, 400
    outline_thickness = 20
    rounding = -1 
    
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    # Rose Pine colors mapped directly from your swaylock configs
    outer_color = rgb(25, 23, 36)      # ring-color=191724
    inner_color = rgb(31, 29, 46)      # inside-color=1f1d2e
    font_color = rgb(224, 222, 244)    # text-color=e0def4
    
    check_color = rgb(235, 111, 146)   # key-hl-color=eb6f92
    fail_color = rgb(49, 116, 143)     # ring-wrong-color=31748f
    
    # Removes the "Input Password" text to mimic an empty swaylock ring
    placeholder_text = 
    fade_on_empty = false
    
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Current Time (Layered INSIDE the top half of the ring)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgb(224, 222, 244)
    font_size = 48
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
    zindex = 1
}

# Date (Layered INSIDE the middle of the ring)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a, %B %e")"
    color = rgb(156, 207, 216) # line-clear-color / foam accent
    font_size = 18
    font_family = Inter
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}

auth {
    fingerprint {
        enabled = true
        ready_message = (Scan fingerprint to unlock)
        present_message = Scanning fingerprint...
        retry_delay = 250
    }
}
