general {
    # 1. This command runs when the system wants to lock
    # (pidof check prevents multiple swaylock instances)
    lock_cmd = pidof swaylock || swaylock -f

    # 2. Lock the screen BEFORE the system goes to sleep
    before_sleep_cmd = loginctl lock-session
    
    # 3. Turn the screen back on when you wake up
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Listener 1: Lock screen after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Listener 2: Turn off screen (save battery) after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Listener 3: Suspend (Deep Sleep) after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
