# profile: server
# name: Server
# icon: 󰒋
# description: Headless server mode. Locks and sleeps display, but CPU stays active.
# lock_timeout: 5m
# dpms_timeout: 5.5m
# suspend_timeout: disabled

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Listener 1: Lock session after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Listener 2: Turn off display (DPMS) after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# No suspend listener. CPU, background network tasks, SSH, and file sharing stay alive.
