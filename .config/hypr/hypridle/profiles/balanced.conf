# profile: balanced
# name: Balanced
# icon: 󰾅
# description: Standard desktop timeouts (5m lock, 5.5m screen off, 20m suspend).
# lock_timeout: 5m
# dpms_timeout: 5.5m
# suspend_timeout: 20m

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Listener 1: Lock session after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Listener 2: Turn off display after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Listener 3: Suspend system after 20 minutes (1200s)
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
