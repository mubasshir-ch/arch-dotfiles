# profile: power-saver
# name: Power Saver
# icon: 󰌪
# description: Aggressive power conservation (1.5m lock, 2m screen off, 5m suspend).
# lock_timeout: 1.5m
# dpms_timeout: 2m
# suspend_timeout: 5m

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Listener 1: Lock session after 90 seconds (1.5m)
listener {
    timeout = 90
    on-timeout = loginctl lock-session
}

# Listener 2: Turn off display after 120 seconds (2m)
listener {
    timeout = 120
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Listener 3: Suspend system after 300 seconds (5m)
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
