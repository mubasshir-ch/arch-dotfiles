# profile: performance
# name: Performance
# icon: 󰓅
# description: Awake mode. System will never lock, sleep, or suspend automatically.
# lock_timeout: disabled
# dpms_timeout: disabled
# suspend_timeout: disabled

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# No automated listeners defined.
# System stays awake indefinitely. Manual lock and suspend remain functional.
